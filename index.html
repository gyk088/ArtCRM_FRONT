<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <!-- Логотип ArtCRM: SVG для современных браузеров, ICO/PNG — для остальных -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#16151a">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtCRM</title>
    <!-- Раньше каждый компонент грузил тот же шрифт своим @import в
         <style> — при бандлинге несколько @import из разных компонентов
         в одном стилшите оказывались не первым правилом и браузер их
         тихо игнорировал ("@import rule was ignored..."). Грузим один раз
         здесь — это всегда валидный порядок, независимо от бандлинга. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&display=swap">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
